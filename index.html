<link rel="manifest" href="manifest.json"><!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BharatMail</title><script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script><style>body{font-family:system-ui;background:#f1f5f9;margin:0}.h{background:#fff;padding:12px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 4px #0001}.b{width:36px;height:36px;background:linear-gradient(135deg,#ff9933,#138808);border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:bold}.card{max-width:380px;margin:60px auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 8px 24px #0001;text-align:center}input{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;margin:8px 0}button{width:100%;padding:12px;background:#1a73e8;color:#fff;border:0;border-radius:10px;font-weight:bold} .otp{background:#e8f0fe;padding:10px;border-radius:8px;margin:10px 0;letter-spacing:2px;font-weight:bold}</style></head><body><div class="h"><div class="b">B</div><b>BharatMail</b></div><div class="card"><h2>🇮🇳 Swagat hai</h2><p style="color:#666">Email daalo, OTP bhejenge</p><input id="e" type="email" placeholder="your email"><button onclick="s()" id="sb">Send OTP</button><div id="s2" style="display:none"><div class="otp" id="od"></div><input id="o" placeholder="OTP dalo"><button onclick="v()">Verify Login</button></div><p id="msg" style="font-size:12px;color:#666"></p></div><script>emailjs.init('IMPFN0ul238t5pYig');let G='';function s(){let em=document.getElementById('e').value.trim();if(!em.includes('@')){alert('Email sahi daalo');return}G=Math.floor(100000+Math.random()*900000)+'';document.getElementById('sb').innerText='Bhej rahe...';emailjs.send('service_7lsgfua','template_6vu2qug',{to_email:em,otp_code:G,from_name:'BharatMail'}).then(()=>{document.getElementById('msg').innerText='Email bheja '+em+' par';show()}).catch(()=>{document.getElementById('msg').innerText='Demo mode (EmailJS limit)';show()})}function show(){document.getElementById('sb').innerText='Send OTP';document.getElementById('s2').style.display='block';document.getElementById('od').innerText='OTP: '+G;alert('OTP: '+G)}function v(){if(document.getElementById('o').value.trim()==G){localStorage.setItem('bm',document.getElementById('e').value);alert('Login Success!');document.body.innerHTML='<div class=h><div class=b>B</div><b>BharatMail</b></div><div class=card><h2>Inbox</h2><p>Logged in as '+localStorage.getItem('bm')+'</p><p>✅ EmailJS Connected: service_7lsgfua</p><button onclick="localStorage.clear();location.reload()">Logout</button></div>'}else{alert('Galat OTP, sahi hai: '+G)}}</script></body></html>
