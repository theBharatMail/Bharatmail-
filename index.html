<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script>
const EMAILJS_SERVICE='service_7lsgfua';
const EMAILJS_TEMPLATE='template_6vu2qug';
const EMAILJS_PUBLIC='IMPFN0ul238t5pYig';
emailjs.init(EMAILJS_PUBLIC);
let generatedOTP='';
function sendOTP(){
 let email=document.getElementById('email').value;
 if(!email){alert('Email bharo');return}
 generatedOTP=Math.floor(100000+Math.random()*900000).toString();
 emailjs.send(EMAILJS_SERVICE,EMAILJS_TEMPLATE,{to_email:email,otp_code:generatedOTP,from_name:'BharatMail'}).then(()=>{
  alert('OTP bhej diya '+email+' par! OTP: '+generatedOTP);
  document.getElementById('step1').style.display='none';
  document.getElementById('step2').style.display='block';
  document.getElementById('otpShow').innerText='OTP: '+generatedOTP;
 }).catch((e)=>{
  alert('Demo OTP: '+generatedOTP);
  document.getElementById('step1').style.display='none';
  document.getElementById('step2').style.display='block';
 });
}
</script>
